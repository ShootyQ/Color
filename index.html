<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color | Paint by number</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#243a33;font:15px system-ui}header,main{max-width:1100px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center}h1{font: bold 32px Georgia;margin:0}small{color:#66776c}button,select,input{font:inherit}button,select,.upload{border:1px solid #d7d9d0;background:white;border-radius:10px;padding:10px 14px;cursor:pointer;color:inherit}button:active{transform:scale(.98)}.primary,.upload{background:#284b3e;color:white;border:0}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px}.paper,.side{background:white;border:1px solid #dedfd7;border-radius:16px;overflow:hidden}.paper{height: min(68vh,700px);min-height:300px;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto;touch-action:pan-x pan-y}.paper canvas{display:block;max-width:none;flex:none;touch-action:manipulation}.side{padding:15px}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.swatch{aspect-ratio:1;padding:0;font-weight:bold;border:2px solid transparent;position:relative}.swatch.active{outline:2px solid #263c34;outline-offset:2px}.swatch.done{opacity:.4}.bar{height:7px;border-radius:5px;background:#e6e8e0;overflow:hidden;margin:10px 0}.bar div{height:100%;background:#529578;width:0%}.tools{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.note{font-size:13px;color:#67746c;line-height:1.5}.status{min-height:22px;margin:8px 0}#empty{text-align:center;padding:30px}#empty h2{font:26px Georgia}#canvas{display:none}@media(max-width:700px){header,main{padding:12px}.layout{display:flex;flex-direction:column}.paper{height:53vh}.palette{display:flex;overflow-x:auto;padding:4px}.swatch{min-width:44px;height:44px}.side{padding:10px}.tools{margin:6px 0}.controls{gap:6px}button,select,.upload{padding:9px}.paper{min-height:220px}}
</style><header><h1>Color<span style="color:#72a18c">.</span></h1><small>Make something yours.</small></header><main>
<div class="controls"><label class="upload">Upload image<input id="file" type="file" accept="image/*" hidden></label><button id="demo">Try a sample</button><label>Colors <select id="count"><option>10</option><option selected>16</option><option>24</option><option>32</option><option>40</option></select></label><label>Detail <select id="detail"><option value="100">Easy</option><option value="180" selected>Medium</option><option value="300">Detailed</option></select></label><button id="generate">Generate puzzle</button></div>
<div class="status" id="status" role="status"></div><div class="layout"><div class="paper" id="paper"><div id="empty"><h2>Your next masterpiece awaits.</h2><p>Choose a photo or try the sample landscape.</p></div><canvas id="canvas"></canvas></div><aside class="side"><strong id="progress">0% complete</strong><div class="bar"><div id="bar"></div></div><div class="palette" id="palette"></div><div class="tools"><button id="hint">Hint</button><button id="undo">Undo</button><button id="zoomout">−</button><button id="zoomin">+</button><button id="preview">Preview</button><button id="save">Save PNG</button></div><p class="note">Select a numbered color, then tap matching shapes. Zoom in for small details. Your photo is processed locally.</p></aside></div></main>
<script>
const $=id=>document.getElementById(id), cv=$('canvas'),ctx=cv.getContext('2d'), paper=$('paper');let source=null,W,H,colors=[],labels,regions=[],ids,selected=0,filled=new Set(),history=[],zoom=1,showPreview=false,highlight=-1;
function sample(){let c=document.createElement('canvas');c.width=500;c.height=360;let x=c.getContext('2d');x.fillStyle='#f6d9aa';x.fillRect(0,0,500,360);x.fillStyle='#e89a65';x.beginPath();x.arc(365,93,48,0,Math.PI*2);x.fill();function poly(color,p){x.fillStyle=color;x.beginPath();p.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()}poly('#a0b1a2',[[0,225],[120,85],[270,235],[360,120],[500,240],[500,360],[0,360]]);poly('#f2f1df',[[80,132],[120,85],[161,136],[125,123],[108,145]]);poly('#527f72',[[0,260],[145,180],[270,260],[415,190],[500,250],[500,360],[0,360]]);poly('#77996d',[[0,280],[160,258],[320,300],[500,250],[500,360],[0,360]]);poly('#6fa7b2',[[235,260],[285,260],[265,300],[350,360],[125,360],[215,300]]);for(let i=0;i<8;i++){let a=25+i*24,b=260+(i%3)*16;poly('#355e4e',[[a,b-65],[a-16,b],[a+16,b]]);x.fillStyle='#795b43';x.fillRect(a-3,b,6,12)}source=c;generate()}
$('demo').onclick=sample;$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let url=URL.createObjectURL(f),img=new Image();img.onload=()=>{source=img;URL.revokeObjectURL(url);generate()};img.onerror=()=>{$('status').textContent='Could not open this image.';URL.revokeObjectURL(url)};img.src=url};$('generate').onclick=()=>source?generate():sample();
function generate(){ $('status').textContent='Creating your puzzle…';setTimeout(build,30)}
function build(){try{let n=+$('detail').value,sw=source.naturalWidth||source.width,sh=source.naturalHeight||source.height;W=Math.max(1,Math.round(sw/Math.max(sw,sh)*n));H=Math.max(1,Math.round(sh/Math.max(sw,sh)*n));let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,W,H);x.filter='blur(0.55px)';x.drawImage(source,0,0,W,H);let d=x.getImageData(0,0,W,H).data,N=W*H,K=+$('count').value;
function dist(i,p){return (d[4*i]-p[0])**2+(d[4*i+1]-p[1])**2+(d[4*i+2]-p[2])**2}
colors=[];let first=Math.floor(N/2);colors.push(Array.from(d.slice(first*4,first*4+3)));let best=new Float64Array(N).fill(Infinity);for(let k=1;k<K;k++){let max=-1,at=0;for(let i=0;i<N;i++){best[i]=Math.min(best[i],dist(i,colors[k-1]));if(best[i]>max){max=best[i];at=i}}if(max<1)break;colors.push(Array.from(d.slice(at*4,at*4+3)))}
K=colors.length;labels=new Uint8Array(N);for(let t=0;t<9;t++){let sums=Array.from({length:K},()=>[0,0,0,0]);for(let i=0;i<N;i++){let b=Infinity,k0=0;for(let k=0;k<K;k++){let v=dist(i,colors[k]);if(v<b){b=v;k0=k}}labels[i]=k0;let s=sums[k0];for(let j=0;j<3;j++)s[j]+=d[4*i+j];s[3]++}if(t<8)colors=colors.map((p,k)=>sums[k][3]?sums[k].slice(0,3).map(v=>Math.round(v/sums[k][3])):p)}
function neighbors(i){let a=[];if(i%W)a.push(i-1);if(i%W<W-1)a.push(i+1);if(i>=W)a.push(i-W);if(i<N-W)a.push(i+W);return a}
function components(){ids=new Int32Array(N).fill(-1);regions=[];for(let i=0;i<N;i++){if(ids[i]>=0)continue;let id=regions.length,k=labels[i],p=[i];ids[i]=id;for(let j=0;j<p.length;j++)for(let v of neighbors(p[j]))if(ids[v]<0&&labels[v]===k){ids[v]=id;p.push(v)}regions.push({k,p})}}
for(let pass=0;pass<3;pass++){components();let next=labels.slice();for(let r of regions){if(r.p.length>=Math.max(5,Math.round(N/4500)))continue;let votes=new Map();for(let i of r.p)for(let v of neighbors(i))if(labels[v]!==r.k)votes.set(labels[v],(votes.get(labels[v])||0)+1);let b=[...votes].sort((a,b)=>b[1]-a[1])[0];if(b)for(let i of r.p)next[i]=b[0]}labels=next}
components();let depth=new Int16Array(N),q=[];for(let i=0;i<N;i++){if(neighbors(i).length<4||neighbors(i).some(v=>ids[v]!==ids[i])){depth[i]=1;q.push(i)}}for(let j=0;j<q.length;j++){let i=q[j];for(let v of neighbors(i))if(!depth[v]&&ids[v]===ids[i]){depth[v]=depth[i]+1;q.push(v)}}for(let r of regions){let cx=0,cy=0;for(let i of r.p){cx+=i%W;cy+=Math.floor(i/W)}cx/=r.p.length;cy/=r.p.length;let best=-Infinity;for(let i of r.p){let s=depth[i]*1000-Math.hypot(i%W-cx,Math.floor(i/W)-cy);if(s>best){best=s;r.anchor=i;r.depth=depth[i]}}}
filled=new Set();history=[];selected=regions[0].k;zoom=1;highlight=-1;showPreview=false;cv.style.display='block';$('empty').style.display='none';cv.width=W*5;cv.height=H*5;fit();render();$('status').textContent=regions.length+' numbered shapes · '+colors.length+' colors';}catch(e){$('status').textContent='Unable to generate puzzle: '+e.message}}
function rgb(k){return 'rgb('+colors[k].join(',')+')'}
function fit(){if(!W)return;let scale=Math.min((paper.clientWidth-8)/W,(paper.clientHeight-8)/H)*zoom;cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';paper.style.justifyContent=zoom>1?'flex-start':'center';paper.style.alignItems=zoom>1?'flex-start':'center'}
function render(){if(!W)return;let S=5;ctx.fillStyle='white';ctx.fillRect(0,0,cv.width,cv.height);for(let r of regions){if(showPreview||filled.has(ids[r.p[0]]))ctx.fillStyle=rgb(r.k);else if(ids[r.p[0]]===highlight)ctx.fillStyle='#ffdd80';else if(r.k===selected)ctx.fillStyle='#edf0ed';else continue;for(let i of r.p)ctx.fillRect(i%W*S,Math.floor(i/W)*S,S,S)}
if(!showPreview){ctx.strokeStyle='#9a9f99';ctx.lineWidth=.65;ctx.beginPath();for(let i=0;i<W*H;i++){let a=i%W*S,b=Math.floor(i/W)*S;if(i%W<W-1&&ids[i]!==ids[i+1]){ctx.moveTo(a+S,b);ctx.lineTo(a+S,b+S)}if(i<W*(H-1)&&ids[i]!==ids[i+W]){ctx.moveTo(a,b+S);ctx.lineTo(a+S,b+S)}}ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#4b5550';for(let r of regions){if(filled.has(ids[r.anchor]))continue;let size=Math.max(5,Math.min(15,r.depth*6));ctx.font=size+'px system-ui';ctx.fillText(r.k+1,(r.anchor%W+.5)*S,(Math.floor(r.anchor/W)+.5)*S)}}
let total=regions.reduce((s,r,i)=>s+(filled.has(i)?r.p.length:0),0),pct=Math.round(100*total/(W*H));$('progress').textContent=pct===100?'Completed!':pct+'% complete';$('bar').style.width=pct+'%';$('palette').replaceChildren();colors.forEach((p,k)=>{let remaining=regions.some((r,i)=>r.k===k&&!filled.has(i));if(!regions.some(r=>r.k===k))return;let b=document.createElement('button');b.className='swatch'+(k===selected?' active':'')+(!remaining?' done':'');b.style.background=rgb(k);b.style.color=(p[0]*.299+p[1]*.587+p[2]*.114)>140?'#222':'white';b.textContent=k+1;b.setAttribute('aria-label','Color '+(k+1));b.onclick=()=>{selected=k;highlight=-1;render()};$('palette').append(b)})}
cv.onclick=e=>{if(showPreview||!W)return;let b=cv.getBoundingClientRect(),x=Math.floor((e.clientX-b.left)/b.width*W),y=Math.floor((e.clientY-b.top)/b.height*H);if(x<0||y<0||x>=W||y>=H)return;let id=ids[y*W+x];if(regions[id].k!==selected||filled.has(id))return;filled.add(id);history.push(id);highlight=-1;if(!regions.some((r,i)=>r.k===selected&&!filled.has(i))){let next=regions.find((r,i)=>!filled.has(i));if(next)selected=next.k}render()};
$('undo').onclick=()=>{if(history.length){let id=history.pop();filled.delete(id);selected=regions[id].k;render()}};$('hint').onclick=()=>{highlight=regions.findIndex((r,i)=>r.k===selected&&!filled.has(i));if(highlight>=0){render();let r=regions[highlight],a=r.anchor;paper.scrollLeft=(a%W/W)*cv.clientWidth-paper.clientWidth/2;paper.scrollTop=(Math.floor(a/W)/H)*cv.clientHeight-paper.clientHeight/2}};$('zoomin').onclick=()=>{zoom=Math.min(8,zoom*1.5);fit()};$('zoomout').onclick=()=>{zoom=Math.max(1,zoom/1.5);fit()};$('preview').onclick=()=>{showPreview=!showPreview;$('preview').textContent=showPreview?'Puzzle':'Preview';render()};$('save').onclick=()=>{if(!W)return;let a=document.createElement('a');a.download='color-puzzle.png';a.href=cv.toDataURL();a.click()};window.addEventListener('resize',fit);
</script></html>
